<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Connect - Chat Tester</title>
  <style>
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
    main { max-width: 520px; margin: 0 auto; }
    h1 { margin-top: 0; }
    section { background: #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    h2 { margin: 0 0 12px; font-size: 1.05rem; }
    form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    input { padding: 9px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: inherit; }
    button { padding: 9px; border: 0; border-radius: 6px; background: #6366f1; color: #fff; cursor: pointer; }
    button:hover { background: #4f46e5; }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.85rem; }
    .bar button { padding: 6px 12px; background: #475569; }
    #messages { list-style: none; margin: 0 0 10px; padding: 10px; height: 280px; overflow-y: auto; background: #0f172a; border-radius: 6px; }
    #messages li { padding: 4px 0; word-break: break-word; }
    #messages li.system { color: #94a3b8; font-style: italic; }
    #chatForm { flex-direction: row; margin: 0; }
    #chatForm input { flex: 1; }
    #authStatus { margin: 0; min-height: 1.2em; font-size: 0.9rem; }
    .ok { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <main>
    <h1>Secure Connect</h1>

    <section id="auth">
      <h2>Sign up</h2>
      <form id="signupForm">
        <input name="username" placeholder="Username" required />
        <input name="email" type="email" placeholder="Email" required />
        <input name="password" type="password" placeholder="Password (min 6 chars)" required />
        <button type="submit">Sign up</button>
      </form>

      <h2>Log in</h2>
      <form id="loginForm">
        <input name="email" type="email" placeholder="Email" required />
        <input name="password" type="password" placeholder="Password" required />
        <button type="submit">Log in</button>
      </form>

      <p id="authStatus"></p>
    </section>

    <section id="chat" hidden>
      <div class="bar">
        <span id="connStatus">Connecting...</span>
        <button id="logoutBtn" type="button">Log out</button>
      </div>
      <ul id="messages"></ul>
      <form id="chatForm">
        <input id="msgInput" autocomplete="off" maxlength="500" placeholder="Type a message..." />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let socket = null;

    function setStatus(text, isError = false) {
      const el = $('authStatus');
      el.textContent = text;
      el.className = isError ? 'error' : 'ok';
    }

    function showChat(show) {
      $('chat').hidden = !show;
      $('auth').hidden = show;
    }

    // textContent (not innerHTML) so chat messages can't inject HTML
    function addMessage(text, cls = '') {
      const li = document.createElement('li');
      li.textContent = text;
      if (cls) li.className = cls;
      $('messages').appendChild(li);
      $('messages').scrollTop = $('messages').scrollHeight;
    }

    async function postJSON(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, data };
    }

    function connectSocket() {
      if (socket) socket.disconnect();
      socket = io(); // the browser sends the HTTP-only token cookie automatically

      socket.on('connect', () => {
        showChat(true);
        $('connStatus').textContent = `Connected (socket ${socket.id})`;
        addMessage('Joined room "general"', 'system');
      });

      socket.on('connect_error', (err) => {
        showChat(false);
        const needsLogin = err.message === 'No token provided';
        setStatus(needsLogin ? 'Please sign up / log in to join the chat.' : err.message, !needsLogin);
      });

      socket.on('disconnect', () => {
        $('connStatus').textContent = 'Disconnected';
      });

      socket.on('chatMessage', ({ username, message }) => {
        addMessage(`${username}: ${message}`);
      });
    }

    $('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const { ok, data } = await postJSON('/api/auth/signup', {
        username: f.username.value,
        email: f.email.value,
        password: f.password.value,
      });
      setStatus(ok ? `${data.message}: ${data.username}. Now log in.` : data.message, !ok);
      if (ok) f.reset();
    });

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const { ok, data } = await postJSON('/api/auth/login', {
        email: f.email.value,
        password: f.password.value,
      });
      if (!ok) return setStatus(data.message, true);
      setStatus(data.message);
      f.reset();
      connectSocket();
    });

    $('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = $('msgInput');
      const text = input.value.trim();
      if (!text || !socket) return;
      socket.emit('chatMessage', text);
      input.value = '';
    });

    $('logoutBtn').addEventListener('click', async () => {
      await postJSON('/api/auth/logout');
      if (socket) socket.disconnect();
      $('messages').replaceChildren();
      showChat(false);
      setStatus('Logged out.');
    });

    connectSocket(); // auto-joins the chat if a valid cookie already exists
  </script>
</body>
</html>
